[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ikmove"
version = "0.1.0"
description = "Inverse kinematics and motion planning for SO-100 arm"
readme = "README.md"
authors = [{ name = "astroyat" }]
dependencies = [
    "ikpy>=3.4.0",
    "numpy>=1.24.0",
]

[tool.setuptools]
py-modules = ["ikmove"]

[tool.setuptools.package-data]
"*" = ["*.urdf"]
